name: Release ARM64 images

on:
  pull_request:
    paths:
      - .github/workflows/images.yml
      - deploy/**
      - pipeline/**
      - robinhood-server/**
      - robinhood-web/**
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release promotion
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 deploy/promote_release.py validate "$RELEASE_TAG"

  image:
    needs: validate
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: yny.ocir.io
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: yny.ocir.io/axrudau2tcfl/robinhood-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  promote:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: robinhood-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 deploy/promote_release.py promote "$RELEASE_TAG"
