# 프로젝트 루트의 credentials.yaml은 GCP KMS 키로 암호화한다.
# 복호화에 사용하는 ADC 계정에는 이 키의 cloudkms.cryptoKeyVersions.useToDecrypt 권한이 필요하다.
# 로컬에서는 gcloud auth application-default login으로 인증할 수 있다. 암호문과 이 설정은 함께 버전 관리한다.
# 평문 키와 ADC/서비스 계정 인증 파일은 배포 환경에서 별도로 관리한다.
creation_rules:
  - path_regex: (^|/)credentials\.ya?ml$
    gcp_kms: projects/default-487602/locations/asia-northeast3/keyRings/homelab-secrets/cryptoKeys/sops-key
