[project]
name = "robinhood-server"
version = "0.2.0"
description = "나랏일보고서 read API and collection jobs"
requires-python = ">=3.12"
dependencies = ["fastapi==0.129.0", "uvicorn==0.40.0", "holidays==0.107", "psycopg[binary]==3.2.12"]

[project.optional-dependencies]
ocr-correction = ["openai-codex==0.160.0"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robinhood_server"]

[project.scripts]
robinhood = "robinhood_server.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
