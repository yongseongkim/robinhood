apiVersion: apps/v1
kind: Deployment
metadata:
  name: robinhood-api
  labels: {{- include "robinhood.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  progressDeadlineSeconds: {{ .Values.api.progressDeadlineSeconds }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "robinhood.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "robinhood.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "robinhood.databaseEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: API_DATABASE_URL
            - name: ROBINHOOD_PSEUDONYMS
              value: {{ .Values.api.pseudonyms | quote }}
            - name: NAVER_MAPS_CLIENT_ID
              value: {{ .Values.api.naverMapsClientId | quote }}
          # 데이터가 없는 첫 수집 중에도 서버를 재시작하지 않는다.
          startupProbe:
            httpGet:
              path: /api/openapi.json
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/openapi.json
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 15
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "robinhood.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: robinhood-api
  labels: {{- include "robinhood.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
