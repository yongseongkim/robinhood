# Optional disposable integration database; not used for production deployments.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: robin_hood_test
      POSTGRES_USER: robin_hood_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robin_hood_test -d robin_hood_test"]
      interval: 2s
      timeout: 3s
      retries: 20
